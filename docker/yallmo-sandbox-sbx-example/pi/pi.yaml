# syntax=docker/sandbox-kit:3
# Real OpenAI OAuth tokens stay on the host. Only a public sentinel is stored in Pi's auth.json.
schemaVersion: "3"
kind: workload
displayName: Pi with host-managed ChatGPT OAuth
dockerfile: ./pi.dockerfile
args:
  image:
    default: docker.io/fmgp/yallmo:dev
    buildArg: YALLMO_IMAGE
  model:
    default: ""
    pattern: '^[A-Za-z0-9._-]*$'
    description: A ChatGPT model ID; empty uses the imported non-secret preferences
    env: YALLMO_PI_MODEL
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - chatgpt.com:443
          - auth.openai.com:443
          # host.docker.internal is translated to localhost by the Sandbox proxy.
          # Only Model Runner's loopback TCP API is exposed, not the whole host network.
          - localhost:12434
          - pi.dev:443
          - github.com:443
          - api.github.com:443
          - raw.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
          - repo.maven.apache.org:443
          - repo1.maven.org:443
          - repo.scala-sbt.org:443
          - repo.scala-lang.org:443
          - registry.npmjs.org:443
          - pypi.org:443
          - files.pythonhosted.org:443
  - type: com.docker.sandbox/credential@1
    description: Host-managed ChatGPT subscription; no API-key fallback or token passthrough
    config:
      service: openai
      phase: runtime
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts: [chatgpt.com]
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
        # Explicit false: never return real OAuth tokens to the Sandbox.
        passthrough: false
