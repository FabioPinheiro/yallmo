# TEST ONLY: no provider credentials and no proxy-managed Sandbox authentication.
# This public test account must never be used for a real deployment.
# Generate a private users.<username>.secretHash as documented in server/README-SERVER.md.
users:
  smoke:
    # Public test password: test-only-web-secret (not a provider credential).
    secretHash: 'pbkdf2-sha256$600000$350d0134c3af0928fc095ad409e763dc$8abf90ca67af9d8cfacd36b73e52f07abd195f7cd780157af91ed26e97b59d11'
agents:
  assistant:
    agentType: ChatGPTAgent
    providerIds: [chatgpt]
    filesystem:
      root: /workspace
    capabilities:
      # Tools execute as UID 1000 inside the container. Do not mount sensitive host directories.
      # scalamode is intentionally omitted until its offline compiler cache is provisioned/tested.
      tools: [filesystem, bash]
      functions: [readFile, listFiles, bash]
    config:
      # Example only: choose a Codex model available to your ChatGPT subscription.
      model: gpt-6.1-sol
providers:
  chatgpt:
    providerType: ChatGPT
