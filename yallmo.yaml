  Transcriber:
    agentType: OAIAgent
    providerIds:
    - docker-mr
    capabilities:
      tools: []
      skills: []
    config:
      model: ai/gemma4:E4B
      systemPrompt: Transcribe the supplied audio exactly. Preserve the spoken language.
        Do not translate, summarize, answer, or call tools. Return only the transcript.
  Gemma:
    agentType: OAIAgent
    providerIds:
    - docker-mr
    config:
      model: ai/gemma4:E4B
      systemPrompt: You are Gemma, a concise assistant.
  sol:
    agentType: ChatGPTAgent
    providerIds:
    - sbx-openai
    config:
      model: gpt-6.1-sol
      systemPrompt: You are Sol, a concise assistant.
      thinkingLevel: high
providers:
  docker-mr:
    providerType: OAI
    endpoint: http://host.docker.internal:12434/v1/
    # My host endpoint  http://localhost:12434/v1/
    # My docker sandbox endpoint: http://model-runner.docker.internal/v1/
  sbx-openai:
    providerType: ChatGPT
    credentials:
      accessToken: ${YALLMO_SBX_OPENAI_ACCESS_TOKEN}
      refreshToken: ${YALLMO_SBX_OPENAI_REFRESH_TOKEN}
      expiresAtMillis: 0
