# Compose-like Docker Sandbox environment. Only workspace/ is mounted; never mount a host auth.json/home.
# The local v3 Pi kit creates a sentinel-only auth.json INSIDE the Sandbox and requests host-managed OAuth.
schemaVersion: "1"
name: yallmo-pi-oauth
agent: pi
args:
  model:
    # Empty inherits the model from pi/preferences.json; --env-arg model=... overrides it.
    default: ""
    pattern: '^[A-Za-z0-9._-]*$'

# Self-contained example: this source folder contains pi.yaml/pi.dockerfile and public placeholder config.
kits:
  - source: ./pi
    args:
      image: docker.io/fmgp/yallmo:dev
      model: ${{ env.args.model }}

# Relative to this file, not your terminal directory. Keep secrets out of this shared directory.
workspace: ./workspace

# Public placeholders ONLY. These are not copied from the host's OAuth login/environment.
# Docker's host proxy replaces the access sentinel on ChatGPT requests and owns token refresh.
env:
  YALLMO_SBX_OPENAI_ACCESS_TOKEN: oai-oat01-proxy-managed
  YALLMO_SBX_OPENAI_REFRESH_TOKEN: oai-ort01-proxy-managed
  YALLMO_SBX_HTTP_PROXY: "true"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

# The unauthenticated website/RPC API is deliberately restricted to your Mac's loopback interface.
ports:
  - sandbox: 8080
    host: 8080
    hostIP: 127.0.0.1

sandboxOptions:
  skills: off
  pullPolicy: always
# No credential mounts, real secret values, host commands or token passthrough.
# Launch is inherited from the Pi kit, which refuses to run without host OAuth metadata.
