# Keep this file at the workspace root so SBX can protect it read-only without
# a renameable parent directory inside the workspace. Review kit changes on the host.
schemaVersion: "1"
name: yallmo-sandbox
agent: kit-yallmo

# Resolve the checkout root relative to this file; sbx preserves its host path.
workspace: .

kits:
  - source: ./docker/yallmo-sandbox/kit-yallmo
    args:
      image: docker.io/fmgp/yallmo:latest
  - source: ./docker/yallmo-sandbox/kit-pi
    args:
      image: docker.io/fmgp/yallmo:latest
      pi_version: 1.6.0
  - source: ./docker/yallmo-sandbox/kit-zsh
    args:
      image: docker.io/fmgp/yallmo:latest

# Kit-declared mounts; host sources resolve relative to this file.
# These fixed paths remain separate from the repository's host-path workspace.
mounts:
  /home/agent/workspace: ./docker/yallmo-sandbox/workspace
  /home/agent/yallmo-workspace: ./docker/yallmo-sandbox/yallmo-workspace
  # A sandbox-specific copy, NOT the host's live ~/.pi.
  /home/agent/.pi: ./docker/yallmo-sandbox/pi

env:
  YALLMO_WORKSPACE: /home/agent/yallmo-workspace
  YALLMO_AUTOSTART: "0" # Set to "0" to keep Bash/Pi but start the service manually.
  YALLMO_SBX_OPENAI_ACCESS_TOKEN: oai-oat01-proxy-managed
  YALLMO_SBX_OPENAI_REFRESH_TOKEN: oai-ort01-proxy-managed
  YALLMO_SBX_HTTP_PROXY: "true"
  YALLMO_SHELL: /bin/zsh

ports:
  - sandbox: 8080
    host: 8080
    hostIP: 127.0.0.1
  - sandbox: 5173
    host: 15173
    hostIP: 127.0.0.1

sandboxOptions:
  skills: off
  pullPolicy: always
