# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Zsh and Bash with private persistent history
dockerfile: ./kit.dockerfile
args:
  image:
    # Match the workload's Ubuntu-based image so native libraries stay compatible.
    default: docker.io/fmgp/yallmo:latest
    buildArg: YALLMO_IMAGE
capabilities:
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.zsh-data
      size: 512m
      tmpfs: false
      mode: "0700"
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.zshrc
          content: |
            # Managed default from the Zsh kit; local edits are preserved.
            source /usr/share/yallmo-zsh/zshrc
          mode: "0644"
          overwrite: false
      install:
        # The volume is mounted before this hook. Never truncate/import history.
        - command: [install, -d, -o, "1000", -g, "1000", -m, "0700", /home/agent/.zsh-data]
          user: "0"
        # Bash usually already has a .bashrc. Append once instead of replacing it.
        - command:
            - /bin/bash
            - -c
            - |
              set -e
              config='source /usr/share/yallmo-zsh/bash-history.bash'
              if ! grep -Fqx -- "$config" "$HOME/.bashrc" 2>/dev/null; then
                printf '\n# Persistent Bash history from the shell kit.\n%s\n' "$config" >> "$HOME/.bashrc"
              fi
          user: "1000"
