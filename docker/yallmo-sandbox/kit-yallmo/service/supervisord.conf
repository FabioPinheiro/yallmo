[unix_http_server]
file=%(ENV_YALLMO_SERVICE_STATE)s/control.sock
chmod=0600

[supervisord]
nodaemon=false
logfile=%(ENV_YALLMO_SERVICE_LOG_DIR)s/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(ENV_YALLMO_SERVICE_STATE)s/supervisord.pid
childlogdir=%(ENV_YALLMO_SERVICE_STATE)s
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_YALLMO_SERVICE_STATE)s/control.sock

[program:yallmo]
command=/bin/bash "%(ENV_YALLMO_SERVICE_WORKSPACE)s/server.sh"
directory=%(ENV_YALLMO_SERVICE_WORKSPACE)s
autostart=%(ENV_YALLMO_SERVICE_AUTOSTART)s
autorestart=false
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_YALLMO_SERVICE_LOG_DIR)s/yallmo.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
