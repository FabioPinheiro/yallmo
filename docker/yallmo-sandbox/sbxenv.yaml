# The repository workspace also exposes this environment file, kit/ and local data.
# Review host-side changes before applying this environment again.
schemaVersion: "1"
name: yallmo-sandbox
agent: kit

# Resolve the checkout root relative to this file; sbx preserves its host path.
workspace: ../..

kits:
  - source: ./kit
    args:
      image: docker.io/fmgp/yallmo:latest
  - source: ./zsh
    args:
      image: docker.io/fmgp/yallmo:latest

# Kit-declared mounts; host sources resolve relative to this file.
# These fixed paths remain separate from the repository's host-path workspace.
mounts:
  /home/agent/workspace: ./workspace
  /home/agent/yallmo-workspace: ./yallmo-workspace
  # A sandbox-specific copy, NOT the host's live ~/.pi.
  /home/agent/.pi: ./pi

env:
  YALLMO_WORKSPACE: /home/agent/yallmo-workspace
  YALLMO_AUTOSTART: "0" # Set to "0" to keep Bash/Pi but start the service manually.
  YALLMO_SBX_OPENAI_ACCESS_TOKEN: oai-oat01-proxy-managed
  YALLMO_SBX_OPENAI_REFRESH_TOKEN: oai-ort01-proxy-managed
  YALLMO_SBX_HTTP_PROXY: "true"
  YALLMO_SHELL: /bin/zsh

ports:
  - sandbox: 8080
    host: 8080
    hostIP: 127.0.0.1
  - sandbox: 5173
    host: 15173
    hostIP: 127.0.0.1

sandboxOptions:
  skills: off
  pullPolicy: always
